<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Isolated storage test</title><style>body{max-width:700px;margin:auto;padding:24px;font:17px/1.5 system-ui}button,input{font:inherit;padding:10px}input{max-width:100%;box-sizing:border-box}pre{white-space:pre-wrap}</style><h1>Isolated storage test</h1><p>Runs only against the test namespace. Do not paste the edit code into chat or screenshots. Leave this page after testing.</p><input id="code" type="password" autocomplete="off" placeholder="Edit code"><button id="run">Run tests</button><pre id="result"></pre><script type="module">
const out=document.getElementById('result');const log=s=>out.textContent+=s+'\n';document.getElementById('run').onclick=async()=>{out.textContent='';const code=document.getElementById('code').value;const base='/api/list?test=1';const req=async(method='GET',body,secret=code)=>fetch(base,{method,headers:{'X-Edit-Code':secret,...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined});try{let r=await req('GET',undefined,'wrong');if(r.status!==401)throw Error('Unauthorized access not rejected');log('PASS: wrong code denied');r=await req();if(!r.ok)throw Error('Test storage read failed');const before=await r.json();const initial=await fetch('/initial-state.json').then(r=>r.json());let a=await req('POST',{state:initial,revision:before.revision});if(!a.ok)throw Error('Authorized write failed');const updated=await a.json();log('PASS: authorized write');r=await req();const read=await r.json();if(read.revision!==updated.revision||read.state.adults!==initial.adults)throw Error('Read-after-write mismatch');log('PASS: strong read after write');r=await req('POST',{state:initial,revision:before.revision});if(r.status!==409)throw Error('Stale write not rejected');log('PASS: stale write rejected');r=await req('POST',{state:{invalid:true},revision:updated.revision});if(r.status!==400)throw Error('Invalid schema not rejected');log('PASS: invalid data denied');log('ALL TESTS PASSED. Production list untouched.');}catch(e){log('FAILED: '+e.message);}finally{document.getElementById('code').value='';}};
</script></html>
